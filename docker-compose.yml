services:
  app:
    build:
      context: ./docker/app
      args:
        uid: ${UID:-1000}
    container_name: vob_sas_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173" # Vite HMR
    networks:
      - vob_sas_network

  web:
    image: nginx:alpine
    container_name: vob_sas_web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vob_sas_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: vob_sas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vobsas}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - vob_sas_pgdata:/var/lib/postgresql/data
    networks:
      - vob_sas_network

  redis:
    image: redis:7-alpine
    container_name: vob_sas_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - vob_sas_redisdata:/data
    networks:
      - vob_sas_network

networks:
  vob_sas_network:
    driver: bridge

volumes:
  vob_sas_pgdata:
    driver: local
  vob_sas_redisdata:
    driver: local

